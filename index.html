<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shike Tools</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"JetBrains Mono"', '"Fira Code"', 'monospace'],
                        sans: ['"Noto Sans SC"', '"PingFang SC"', '"Microsoft YaHei"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { -webkit-font-smoothing: antialiased; }
        .dot-grid {
            background-image: radial-gradient(circle, #e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }
    </style>
</head>
<body class="font-sans text-gray-700 bg-white dot-grid min-h-screen">

    <div class="max-w-2xl mx-auto px-6 pt-24 pb-16">

        <!-- Header -->
        <div class="mb-16">
            <h1 class="font-mono text-3xl text-gray-900 font-bold tracking-tight">Shike Tools</h1>
            <p class="mt-2 text-gray-400 font-mono text-sm">~ 一些自己用的工具</p>
        </div>

        <!-- Tools -->
        <div class="space-y-8">
            <div class="border border-gray-200 rounded-xl p-6 hover:border-gray-300 transition-colors">
                <h2 class="font-mono text-lg font-semibold text-gray-900">survey</h2>
                <p class="mt-2 text-sm text-gray-500 leading-relaxed">
                    设计工作室用的客户需求问卷工具。发送链接给客户，手机打开即填，提交结果自动归档。
                </p>
            </div>

            <div class="border border-gray-200 rounded-xl p-6 hover:border-gray-300 transition-colors opacity-50">
                <h2 class="font-mono text-lg font-semibold text-gray-900">dashboard</h2>
                <p class="mt-2 text-sm text-gray-500 leading-relaxed">
                    数据看板。还在想做什么，先占个位。
                </p>
            </div>

            <div class="border border-gray-200 rounded-xl p-6 hover:border-gray-300 transition-colors opacity-50">
                <h2 class="font-mono text-lg font-semibold text-gray-900">more</h2>
                <p class="mt-2 text-sm text-gray-500 leading-relaxed">
                    更多工具开发中。
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="mt-20 pt-8 border-t border-gray-100 text-xs text-gray-300 font-mono">
            <span>shike.app</span>
            <span class="mx-2">·</span>
            <span class="text-gray-200">{ tools for the curious }</span>
        </div>

    </div>

</body>
</html>
